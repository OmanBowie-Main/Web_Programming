<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 01 - Daftar Produk</title>
</head>
<body>

    <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse; margin: 20px auto; font-family: Arial, sans-serif;">
        <!-- Header / Judul Tabel -->
        <tr>
            <td colspan="3" align="center" bgcolor="#ffc080">
                <b>DAFTAR PRODUK</b>
            </td>
        </tr>
        
        <!-- Baris 1: Gambar & Nama Produk -->
        <tr>
            <!-- Sel Gambar (menggabungkan 3 baris ke bawah) -->
            <td rowspan="3" bgcolor="#ffff99" align="center" valign="middle">
                <img src="Image/Kamera.jpeg" alt="Canon EOS M10" width="150">
            </td>
            <td bgcolor="#00ff66" style="font-weight: bold;">
                Nama Produk
            </td>
            <td bgcolor="#ff66ff">
                Canon EOS M10 Kit EF-M 15-45mm
            </td>
        </tr>

        <!-- Baris 2: Harga -->
        <tr>
            <td bgcolor="#00ff66" style="font-weight: bold;">
                Harga
            </td>
            <td bgcolor="#ff66ff">
                Rp 4,899,000
            </td>
        </tr>

        <!-- Baris 3: Fitur Produk -->
        <tr>
            <td bgcolor="#00ff66" style="font-weight: bold;">
                Fitur Produk
            </td>
            <td bgcolor="#ff66ff">
                <ul style="margin: 0; padding-left: 20px;">
                    <li>Kamera mirrorless</li>
                    <li>Efektifitas Piksel : 18 MP</li>
                    <li>Tipe sensor : CMOS DIGIC 6</li>
                    <li>Layar : 3.0 Inch</li>
                    <li>Memiliki lampu flash dengan jarak jangkauan hingga 5 meter</li>
                </ul>
            </td>
        </tr>
    </table>

</body>
</html>
